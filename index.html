<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./css/output.css" rel="stylesheet">
  <title>Recette de cuisine</title>
  <meta name="description" content="Recette de cuisine">
  <meta name="author" content="Thomas Sanouiller">
  <meta name="keywords" content="recette, cuisine, plat, dessert, entrée">
</head>
<body>
  <header class="relative w-full z-10">
    <a href="index.html" class="absolute left-[69px] top-[51px]">
      <img src="./assets/logos/petits-plats-logo.png" class="w-[214px]" alt="Logo de Petits Plats.">
    </a>
  </header>
  <main>
    <section class="h-[667px] w-full flex flex-col items-center justify-center relative gap-[30px]">
      <h1 class="text-center text-4xl font-bold z-10 font-anton text-secondary text-center text-[44px] max-w-[700px] font-[400] leading-[140%]">CHERCHEZ PARMI PLUS DE 1500 RECETTES DU QUOTIDIEN,SIMPLES ET DÉLICIEUSES</h1>
      <div class="relative flex items-center justify-between z-10 rounded-[11px] bg-white pt-[10px] pb-[10px] pl-[35px] pr-[10px] w-[954px] gap-[10px]">
        <input id="main-search-input" type="text" placeholder="Rechercher une recette, un ingrédient, ..." class="border-none outline-none text-tertiary text-[16px] font-[400] leading-[100%] w-full">
        <svg id="main-search-reset" class="absolute right-[85px] top-[29px] hidden cursor-pointer" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 17 17" fill="none">
          <path d="M15 15L8.5 8.5M8.5 8.5L2 2M8.5 8.5L15 2M8.5 8.5L2 15" stroke="#7A7A7A" stroke-width="2.16667" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <button class="flex items-center justify-center w-[52px] h-[52px] rounded-[10px] border-none outline-none bg-primary text-white hover:bg-secondary hover:text-black  transition-all duration-200">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="29" viewBox="0 0 28 29" fill="none">
            <circle cx="10" cy="10.4219" r="9.5" stroke="currentColor"/>
            <line x1="18.3536" y1="19.0683" x2="27.3536" y2="28.0683" stroke="currentColor"/>
          </svg>
        </button>
      </div>
      <img src="./assets/images/hero-bg.png" class="absolute top-0 left-0 w-full h-full object-cover z-1" alt="Photo d'un plat de cuisine.">
    </section>
    <div class="w-full bg-quaternary pl-[104px] pr-[104px] pt-[21px] pb-[100px] flex flex-col gap-[55px]">
      <div class="flex w-full justify-between max-w-[1236px] mx-auto">
        <div class="flex gap-[66px]">
          <div id="ingredients-dropdown-container" class="flex-col">
            <div id="ingredients-dropdown" class="border-none h-min text-primary font-manrope text-[16px] font-[500] leading-[140%] w-[192px] rounded-[11px] bg-white">
              <div id="ingredients-dropdown-label" class="flex items-center justify-between p-[16px] cursor-pointer">
                <p class="text-primary font-manrope text-[16px] font-[500] leading-[140%]">Ingrédients</p>
                <div id="ingredients-dropdown-icn" class="ease-out duration-200 flex items-center justify-center ">
                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="8" viewBox="0 0 15 8" fill="none">
                    <path d="M1 1L7.5 7L14 1" stroke="#1B1B1B" stroke-linecap="round"/>
                  </svg>
                </div>
              </div>
              <div id="ingredients-dropdown-content" class="h-[0px] overflow-hidden">
                <div class="relative h-[36px] border-[1px] border-primary rounded-[2px] outline-none text-primary font-manrope text-[14px] font-[400] leading-[100%] w-[calc(100%-32px)] p-[8px] mx-[16px] mb-[11px] flex items-center gap-[10px]">
                  <input id="ingredients-search-input" class="absolute left-[12px] top-[10px] bottom-[10px] right-[41px] w-[calc(100%-53px)] h-[calc(100%-20px)] outline-none flex" type="text">
                  <svg class="absolute right-[12px] top-[12px]" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <circle cx="5" cy="5" r="4.75" stroke="#7A7A7A" stroke-width="0.5"/>
                    <line x1="9.17678" y1="9.32322" x2="13.6768" y2="13.8232" stroke="#7A7A7A" stroke-width="0.5"/>
                  </svg>
                  <svg class="absolute right-[35px] top-[14px] hidden cursor-pointer" xmlns="http://www.w3.org/2000/svg" width="8" height="8" viewBox="0 0 8 8" fill="none">
                    <path d="M7 7L4 4M4 4L1 1M4 4L7 1M4 4L1 7" stroke="#7A7A7A" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
                <div id="ingredients-checked-filters" class="flex flex-col gap-[4px] mb-[21px]">
                </div>
                <div id="ingredients-unchecked-filters" class="flex flex-col gap-[13px]">
                </div>
              </div>
            </div>
            <div id="ingredients-checked-filters-container" class="flex flex-col gap-[4px] mt-[21px]">
            </div>
          </div>
          <div id="appareils-dropdown-container" class="flex-col">
            <div id="appareils-dropdown" class="border-none h-min text-primary font-manrope text-[16px] font-[500] leading-[140%] w-[192px] rounded-[11px] bg-white">
              <div id="appareils-dropdown-label" class="flex items-center justify-between p-[16px] cursor-pointer">
                <p class="text-primary font-manrope text-[16px] font-[500] leading-[140%]">Appareils</p>
                <div id="appareils-dropdown-icn" class="ease-out duration-200 flex items-center justify-center ">
                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="8" viewBox="0 0 15 8" fill="none">
                    <path d="M1 1L7.5 7L14 1" stroke="#1B1B1B" stroke-linecap="round"/>
                  </svg>
                </div>
              </div>
              <div id="appareils-dropdown-content" class="h-[0px] overflow-hidden">
                <div class="relative h-[36px] border-[1px] border-primary rounded-[2px] outline-none text-primary font-manrope text-[14px] font-[400] leading-[100%] w-[calc(100%-32px)] p-[8px] mx-[16px] mb-[11px] flex items-center gap-[10px]">
                  <input id="appareils-search-input" class="absolute left-[12px] top-[10px] bottom-[10px] right-[41px] w-[calc(100%-53px)] h-[calc(100%-20px)] outline-none" type="text">
                  <svg class="absolute right-[12px] top-[12px]" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <circle cx="5" cy="5" r="4.75" stroke="#7A7A7A" stroke-width="0.5"/>
                    <line x1="9.17678" y1="9.32322" x2="13.6768" y2="13.8232" stroke="#7A7A7A" stroke-width="0.5"/>
                  </svg>
                  <svg class="absolute right-[35px] top-[14px] cursor-pointer" xmlns="http://www.w3.org/2000/svg" width="8" height="8" viewBox="0 0 8 8" fill="none">
                    <path d="M7 7L4 4M4 4L1 1M4 4L7 1M4 4L1 7" stroke="#7A7A7A" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
                <div id="appareils-checked-filters" class="flex flex-col gap-[4px] mb-[21px]">
                </div>
                <div id="appareils-unchecked-filters" class="flex flex-col gap-[13px]">
                </div>
              </div>
            </div>
            <div id="appareils-checked-filters-container" class="flex flex-col gap-[4px] mt-[21px]">
            </div>
          </div>
          <div id="ustensiles-dropdown-container" class="flex-col">
            <div id="ustensiles-dropdown" class="border-none h-min text-primary font-manrope text-[16px] font-[500] leading-[140%] w-[192px] rounded-[11px] bg-white">
              <div id="ustensiles-dropdown-label" class="flex items-center justify-between p-[16px] cursor-pointer">
                <p class="text-primary font-manrope text-[16px] font-[500] leading-[140%]">Ustensiles</p>
                <div id="ustensiles-dropdown-icn" class="ease-out duration-200 flex items-center justify-center ">
                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="8" viewBox="0 0 15 8" fill="none">
                    <path d="M1 1L7.5 7L14 1" stroke="#1B1B1B" stroke-linecap="round"/>
                  </svg>
                </div>
              </div>
              <div id="ustensiles-dropdown-content" class="h-[0px] overflow-hidden">
                <div class="relative h-[36px] border-[1px] border-primary rounded-[2px] outline-none text-primary font-manrope text-[14px] font-[400] leading-[100%] w-[calc(100%-32px)] p-[8px] mx-[16px] mb-[11px] flex items-center gap-[10px]">
                  <input id="ustensiles-search-input" class="absolute left-[12px] top-[10px] bottom-[10px] right-[41px] w-[calc(100%-53px)] h-[calc(100%-20px)] outline-none flex" type="text">
                  <svg class="absolute right-[12px] top-[12px]" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <circle cx="5" cy="5" r="4.75" stroke="#7A7A7A" stroke-width="0.5"/>
                    <line x1="9.17678" y1="9.32322" x2="13.6768" y2="13.8232" stroke="#7A7A7A" stroke-width="0.5"/>
                  </svg>
                  <svg class="absolute right-[35px] top-[14px] cursor-pointer" xmlns="http://www.w3.org/2000/svg" width="8" height="8" viewBox="0 0 8 8" fill="none">
                    <path d="M7 7L4 4M4 4L1 1M4 4L7 1M4 4L1 7" stroke="#7A7A7A" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
                <div id="ustensiles-checked-filters" class="flex flex-col gap-[4px] mb-[21px]">
                </div>
                <div id="ustensiles-unchecked-filters" class="flex flex-col gap-[13px]">
                </div>
              </div>
            </div>
            <div id="ustensiles-checked-filters-container" class="flex flex-col gap-[4px] mt-[21px]">
            </div>
          </div>
        </div>
        <p id="recipes-counter" class="flex mt-[12px] justify-center text-primary font-anton text-[21px] font-[400] leading-[140%]">20 recettes</p>
      </div>
      <div id="recipes-gallery" class="w-full grid grid-cols-3 gap-[48px] max-w-[1236px] mx-auto">
      </div>
    </div>
  </main>
  <footer class="w-full h-[100px] bg-quaternary">
  </footer>
  <script type="module" src="./scripts/dom/dom.js"></script>
  <script type="module" src="./scripts/api/api.js"></script>
</body>
</html>
