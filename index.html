<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./css/output.css" rel="stylesheet">
  <title>Recette de cuisine</title>
  <meta name="description" content="Recette de cuisine">
  <meta name="author" content="Thomas Sanouiller">
  <meta name="keywords" content="recette, cuisine, plat, dessert, entrée">
</head>
<body>
  <header class="relative w-full z-10">
    <a href="index.html" class="absolute left-[69px] top-[51px]">
      <img src="./assets/logos/petits-plats-logo.png" class="w-[214px]" alt="Logo de Petits Plats.">
    </a>
  </header>
  <main>
    <section class="h-[667px] w-full flex flex-col items-center justify-center relative gap-[30px]">
      <h1 class="text-center text-4xl font-bold z-10 font-anton text-secondary text-center text-[44px] max-w-[700px] font-[400] leading-[140%]">CHERCHEZ PARMI PLUS DE 1500 RECETTES DU QUOTIDIEN,SIMPLES ET DÉLICIEUSES</h1>
      <div class="flex items-center justify-between z-10 rounded-[11px] bg-white pt-[10px] pb-[10px] pl-[35px] pr-[10px] w-[954px] gap-[10px]">
        <input type="text" placeholder="Rechercher une recette, un ingrédient, ..." class="border-none outline-none text-tertiary text-[16px] font-[400] leading-[100%] w-full">
        <!--RESET BUTTON HERE-->
        <button class="flex items-center justify-center w-[52px] h-[52px] rounded-[10px] border-none outline-none bg-primary text-white hover:bg-secondary hover:text-black  transition-all duration-200">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="29" viewBox="0 0 28 29" fill="none">
            <circle cx="10" cy="10.4219" r="9.5" stroke="currentColor"/>
            <line x1="18.3536" y1="19.0683" x2="27.3536" y2="28.0683" stroke="currentColor"/>
          </svg>
        </button>
      </div>
      <img src="./assets/images/hero-bg.png" class="absolute top-0 left-0 w-full h-full object-cover z-1" alt="Photo d'un plat de cuisine.">
    </section>
    <section class="w-full bg-quaternary pl-[104px] pr-[104px] pt-[21px] pb-[100px] flex flex-col gap-[55px]">
      <div class="flex w-full items-center justify-between max-w-[1236px] mx-auto">
        <div class="flex items-center gap-[66px]">
          <div id="ingredients-dropdown" class="border-none text-primary font-manrope text-[16px] font-[500] leading-[140%] w-[192px] rounded-[11px] bg-white">
            <div id="ingredients-dropdown-label" class="flex items-center justify-between p-[16px]">
              <p class="text-primary font-manrope text-[16px] font-[500] leading-[140%]">Ingrédients</p>
              <div id="ingredients-dropdown-icon" class="ease-out duration-200 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="8" viewBox="0 0 15 8" fill="none">
                  <path d="M1 1L7.5 7L14 1" stroke="#1B1B1B" stroke-linecap="round"/>
                </svg>
              </div>
            </div>
            <div id="ingredients-dropdown-content" class="h-[0px] overflow-hidden transition-all duration-200">
              <input type="text" class="border-[1px] border-primary rounded-[2px] outline-none text-primary font-manrope text-[14px] font-[400] leading-[100%] w-[calc(100%-32px)] p-[8px] mx-[16px] mb-[11px]">
              <div id="ingredients-checked-filters" class="flex flex-col gap-[4px]">
              </div>

              <div class="flex relative">
                <input type="checkbox" class="peer border-none opacity-0 outline-none absolute top-0 left-0 z-10 bg-[transparent] w-full h-full">
                <label class="text-primary font-manrope text-[14px] font-[400] leading-[100%] w-full peer-checked:bg-secondary peer-checked:py-[9px] px-[16px]">Coco</label>
              </div>
            </div>
          </div>
        </div>
        <p id="recipes-counter" class="text-primary font-anton text-[21px] font-[400] leading-[140%]">20 recettes</p>
      </div>
      <div id="recipes-gallery" class="w-full grid grid-cols-3 gap-[48px] max-w-[1236px] mx-auto">
      </div>
    </section>
  </main>
  <footer class="w-full h-[100px] bg-quaternary">
  </footer>
  <script type="module" src="./scripts/dom/dom.js"></script>
  <script type="module" src="./scripts/api/api.js"></script>
</body>
</html>
